name: Build Forge

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      store_test:
        description: Also install every AI agent from the Store on the emulator and report which work
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/forge.p12

      - name: Build release APKs
        env:
          FORGE_KEYSTORE: forge.p12
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TERMUX_APP_VERSION_NAME: 1.0.${{ github.run_number }}
          TERMUX_APK_VERSION_TAG: v1.0.${{ github.run_number }}
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
        run: |
          chmod +x gradlew
          export FORGE_VERSION_CODE=$((1100 + ${{ github.run_number }}))
          ./gradlew downloadBootstraps --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0.${{ github.run_number }}
          gh release create "$TAG" --title "Forge $TAG" --notes "Automatic build of ${GITHUB_SHA:0:7}"             app/build/outputs/apk/release/*arm64-v8a.apk app/build/outputs/apk/release/*x86_64.apk             app/build/outputs/apk/release/*universal.apk

  emulator-check:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        run: gh release download "v1.0.${{ github.run_number }}" -R "${{ github.repository }}" -p "*x86_64.apk"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/emulator-check.sh

      - name: Attach screenshots to the release
        if: always()
        run: |
          ls -la shots || exit 0
          gh release upload "v1.0.${{ github.run_number }}" shots/*.png shots/*.txt -R "${{ github.repository }}" --clobber

  store-check:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.store_test
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        run: gh release download "v1.0.${{ github.run_number }}" -R "${{ github.repository }}" -p "*x86_64.apk"

      - name: Install every AI agent on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 6144M
          emulator-boot-timeout: 1200
          script: GROUP=${{ matrix.group }} bash .github/scripts/store-check.sh

      - name: Attach the report to the release
        if: always()
        run: |
          ls -la shots || exit 0
          gh release upload "v1.0.${{ github.run_number }}" shots/store-*.png -R "${{ github.repository }}" --clobber
